[project]
name = "reference-checker"
version = "1.0.2"
description = "A GUI desktop app for verifying the integrity of academic references."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "habanero>=2.3.0",
    "jellyfish>=1.2.1",
    "numpy>=2.4.2",
    "pymupdf>=1.27.1",
    "pyside6>=6.10.2",
    "python-dotenv>=1.2.2",
    "rapidfuzz>=3.14.3",
    "requests>=2.32.5",
    "stop-words>=2025.11.4",
    "weasyprint>=68.1",
]

[project.scripts]
reference-checker = "reference_checker.main:run_app"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.5"]
build-backend = "uv_build"
